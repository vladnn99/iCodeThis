name: Deploy NEC Contact API

on:
  push:
    branches: [main]
    paths:
      - 'contact-outlook/api/**'
      - 'contact-outlook/graph.cjs'
      - 'contact-outlook/company-fields.cjs'
      - 'contact-outlook/turnstile.cjs'
      - '.github/workflows/main_nec-contact-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nec-contact-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: contact-outlook/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: contact-outlook/api/package-lock.json
      - name: Install API dependencies
        run: npm ci --ignore-scripts
      - name: Build and test API without real emails
        run: npm test
      - name: Prepare API-only deployment package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nec-contact-api"
          cp host.json package.json package-lock.json "$RUNNER_TEMP/nec-contact-api/"
          cp -R src lib node_modules "$RUNNER_TEMP/nec-contact-api/"
      - name: Login to Azure with GitHub identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D2BA57FE7628493683E18595736B4AF4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2BFA9C96FF5545E0845C959A4FBEDFB5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2B8E6DD543EF40EBADF34ADF8529F660 }}
      - name: Deploy to Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: nec-contact-api
          package: ${{ runner.temp }}/nec-contact-api
          sku: flexconsumption
